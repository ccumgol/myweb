{{- $src := .Get "src" -}}
{{- $h := .Get "height" | default "80vh" -}}
<div class="mapframe" style="position:relative;width:100%;height:{{ $h }};min-height:520px;border:1px solid rgba(128,128,128,.28);border-radius:14px;overflow:hidden;margin:1.6rem 0;box-shadow:0 2px 14px rgba(0,0,0,.10);">
  <iframe src="{{ $src }}" loading="lazy" title="성경지도 인터랙티브 지도" style="width:100%;height:100%;border:0;display:block"></iframe>
</div>
