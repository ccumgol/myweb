{{/* Page-scoped styles. Bible-study list: title marker, row dividers, right-aligned thumbnail. */}}
{{ if eq .Section "bible-study" }}
<style>
  /* row dividers between items */
  main .article-link--simple { border-top: 1px solid var(--line); padding-top: 1.15rem; margin-top: 0.5rem; }
  main .article-link--simple:first-of-type { border-top: 0; margin-top: 0; }

  /* marker before each title */
  main .article-link--simple h2 { position: relative; padding-left: 1.6rem; }
  main .article-link--simple h2::before {
    content: "🁢";
    position: absolute; left: 0; top: 0.02em;
    color: var(--accent-text); font-size: 0.95em; line-height: 1.2;
  }

  /* thumbnail: stacked on mobile, fixed box on the RIGHT from 640px up */
  main .article-link--simple .thumbnail {
    position: relative;
    width: 100%; height: 190px; min-height: 0;
    border-radius: 10px; overflow: hidden;
    margin: 0 0 0.85rem;
  }
  @media (min-width: 640px) {
    main .article-link--simple { flex-direction: row; align-items: center; gap: 1.5rem; }
    main .article-link--simple > div:not(.thumbnail) { order: 1; flex: 1 1 auto; margin: 0; min-width: 0; }
    main .article-link--simple .thumbnail { order: 2; flex: none; width: 168px; height: 104px; min-height: 0; margin: 0; }
  }
</style>
{{ end }}
