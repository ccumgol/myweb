<style>
.sbx {
  --ink: #191b23; --soft: #5c6175; --paper: #f4f5f9; --card: #ffffff; --line: #e2e4ee;
  --accent: #2f5aa8; --deep: #1f3f7a; --tint: #e7eef9; --gold: #d99a1e; --notice: #fff5e3; --noticeInk: #8a4f00;
  color: var(--ink); background: var(--paper);
  background-image: linear-gradient(180deg, #e3ebf8 0, var(--paper) 440px);
  border: 1px solid var(--line); border-radius: 18px;
  padding: clamp(20px, 4vw, 56px); margin: 8px 0 40px; overflow: hidden;
}
html.dark .sbx {
  --ink: #ecedf3; --soft: #9da2b3; --paper: #0f1117; --card: #181b24; --line: #262a36;
  --accent: #7fa5ea; --deep: #b3cbf5; --tint: #1c2a45; --gold: #f0bd55; --notice: #2b2416; --noticeInk: #f5be62;
  background-image: linear-gradient(180deg, #16223a 0, var(--paper) 440px);
}
.sbx h1, .sbx h2, .sbx h3, .sbx p { margin: 0; color: inherit; word-break: keep-all; overflow-wrap: break-word; }
.sbx a { text-decoration: none; }
.sbx section + section { margin-top: clamp(48px, 7vw, 88px); }
.sbx-h2 { font-weight: 800; font-size: clamp(1.45rem, 3vw, 2rem); line-height: 1.3; margin-bottom: 10px !important; letter-spacing: -.01em; }
.sbx-h2 span { color: var(--accent); }
.sbx-sub { color: var(--soft); line-height: 1.8; max-width: 44em; margin-bottom: 24px !important; }
.sbx-note { margin-top: 14px !important; font-size: .88rem; color: var(--soft); line-height: 1.7; }

/* Hero */
.sbx-hero { display: grid; grid-template-columns: 1.15fr 1fr; gap: clamp(20px, 4vw, 52px); align-items: center; }
.sbx-kicker { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; color: var(--deep); }
.sbx-kicker img { width: 44px; height: 44px; border-radius: 11px; margin: 0 !important; box-shadow: 0 4px 12px rgba(47,90,168,.3); }
.sbx-title { font-weight: 800; font-size: clamp(2rem, 4.8vw, 3.2rem); line-height: 1.2; letter-spacing: -.02em; margin: 18px 0 16px !important; }
.sbx-title em { font-style: normal; color: var(--accent); }
.sbx-title b { color: var(--gold); }
.sbx-lead { font-size: 1.08rem; line-height: 1.85; color: var(--soft); max-width: 32em; }
.sbx-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 26px; }
.sbx-btn {
  display: inline-flex; flex-direction: column; justify-content: center; min-height: 54px; padding: 8px 22px;
  border-radius: 14px; background: var(--accent); color: #fff !important; font-weight: 700; font-size: 1.02rem; line-height: 1.2;
  box-shadow: 0 6px 16px rgba(47,90,168,.3); transition: transform .12s, box-shadow .12s;
}
html.dark .sbx-btn { color: #0f1117 !important; }
.sbx-btn small { font-size: .7rem; font-weight: 600; letter-spacing: .04em; opacity: .85; }
.sbx-btn:hover { transform: translateY(-2px); }
.sbx-btn-off, html.dark .sbx-btn-off { background: transparent; color: var(--deep) !important; border: 2px dashed var(--line); box-shadow: none; cursor: default; }
.sbx-btn-off:hover { transform: none; }
.sbx-btn-ghost, html.dark .sbx-btn-ghost { background: var(--card); color: var(--deep) !important; border: 1px solid var(--line); box-shadow: none; }
.sbx-platforms { margin-top: 16px !important; font-size: .88rem; color: var(--soft); line-height: 1.7; }
.sbx-hero-shot { margin: 0; display: flex; flex-direction: column; align-items: center; }
.sbx-hero-icon { display: block; width: min(260px, 70%); height: auto; border-radius: 22%; margin: 0 !important; box-shadow: 0 24px 50px rgba(31,63,122,.28); }
.sbx-caption { margin-top: 14px !important; font-size: .85rem; color: var(--soft); text-align: center; }

/* Steps (one Sunday) */
.sbx-steps { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; counter-reset: step; }
.sbx-steps li { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; counter-increment: step; }
.sbx-steps li::before { content: counter(step); display: inline-flex; width: 30px; height: 30px; align-items: center; justify-content: center; border-radius: 15px; background: var(--accent); color: #fff; font-weight: 800; }
html.dark .sbx-steps li::before { color: #0f1117; }
.sbx-steps h3 { font-size: 1.02rem; font-weight: 800; margin: 12px 0 6px !important; }
.sbx-steps p { color: var(--soft); line-height: 1.7; font-size: .93rem; }

/* Features */
.sbx-feats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; list-style: none; padding: 0; margin: 0; }
.sbx-feat { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; }
.sbx-feat-icon { display: inline-flex; width: 38px; height: 38px; align-items: center; justify-content: center; border-radius: 10px; background: var(--tint); color: var(--accent); font-weight: 800; }
.sbx-feat h3 { font-size: 1.02rem; font-weight: 800; margin: 12px 0 6px !important; }
.sbx-feat p { color: var(--soft); line-height: 1.7; font-size: .93rem; }

/* Storage */
.sbx-stores { margin: 0; display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.sbx-stores > div { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; }
.sbx-stores dt { font-weight: 800; margin-bottom: 4px; }
.sbx-stores dd { margin: 0; color: var(--soft); line-height: 1.65; font-size: .93rem; }

/* Price */
.sbx-receipt { max-width: 640px; margin-left: auto; margin-right: auto; }
.sbx-receipt dl { margin: 0; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 6px 22px; }
.sbx-receipt dl > div { display: flex; justify-content: space-between; gap: 16px; padding: 14px 0; border-top: 1px dashed var(--line); }
.sbx-receipt dl > div:first-child { border-top: 0; }
.sbx-receipt dt { font-weight: 700; }
.sbx-receipt dt span { display: block; font-weight: 400; font-size: .88rem; color: var(--soft); margin-top: 2px; }
.sbx-receipt dd { margin: 0; font-weight: 800; color: var(--deep); white-space: nowrap; }

/* Buy Me a Coffee */
.sbx-tip {
  max-width: 640px; margin-left: auto; margin-right: auto; text-align: center;
  background: linear-gradient(180deg, #fff8d6, #fff2b0); border: 1px solid #f0d664; border-radius: 18px;
  padding: clamp(24px, 4vw, 36px) clamp(18px, 4vw, 40px); display: flex; flex-direction: column; align-items: center; gap: 14px;
}
html.dark .sbx-tip { background: linear-gradient(180deg, #2b2716, #241f10); border-color: #5a4c18; }
.sbx-tip-text { font-weight: 800; font-size: clamp(1.2rem, 2.6vw, 1.5rem); line-height: 1.5; }
.sbx-tip-lead { color: var(--soft); line-height: 1.8; max-width: 30em; font-size: .97rem; }
.sbx-btn-coffee {
  display: inline-flex; align-items: center; gap: 14px; margin-top: 6px; padding: 12px 30px; min-height: 66px;
  border-radius: 14px; background: #ffdd00; color: #0d0c22 !important; border: 2px solid #0d0c22;
  font-weight: 800; font-size: 1.25rem; line-height: 1.15; text-align: left;
  box-shadow: 4px 4px 0 #0d0c22; transition: transform .12s, box-shadow .12s;
}
.sbx-btn-coffee span { display: flex; flex-direction: column; }
.sbx-btn-coffee small { font-size: .72rem; font-weight: 700; letter-spacing: .03em; opacity: .85; }
.sbx-btn-coffee:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 #0d0c22; }
.sbx-btn-coffee:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 #0d0c22; }
html.dark .sbx-btn-coffee { border-color: #ffdd00; box-shadow: 4px 4px 0 rgba(0,0,0,.6); }
.sbx-bmc-logo { width: 26px; height: 37px; margin: 0 !important; flex: none; }
.sbx-tip-note { font-size: .8rem; color: var(--soft); }

/* Close */
.sbx-end { text-align: center; display: flex; flex-direction: column; align-items: center; }
.sbx-promise { font-size: clamp(1.15rem, 2.4vw, 1.4rem); font-weight: 700; line-height: 1.6; max-width: 28em; }
.sbx-end .sbx-cta { justify-content: center; }
.sbx-links { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 20px; margin-top: 22px; font-size: .92rem; }
.sbx-links a { color: var(--deep); font-weight: 600; }

@media (max-width: 860px) {
  .sbx-hero { grid-template-columns: 1fr; }
  .sbx-feats { grid-template-columns: repeat(2, 1fr); }
  .sbx-steps { grid-template-columns: 1fr; }
}
@media (max-width: 600px) {
  .sbx-btn-coffee { gap: 10px; padding: 11px 18px; font-size: 1.08rem; white-space: nowrap; }
  .sbx-bmc-logo { width: 22px; height: 31px; }
  .sbx-feats, .sbx-stores, .sbx-steps { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { .sbx-btn, .sbx-btn-coffee { transition: none; } }
</style>
