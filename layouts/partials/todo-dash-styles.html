<style>
.td {
  --ink: #191b23; --soft: #5c6175; --paper: #f4f5f9; --card: #ffffff; --line: #e2e4ee;
  --accent: #5b5bd6; --deep: #3f3fb0; --tint: #ededfd; --notice: #fff5e3; --noticeInk: #8a4f00;
  color: var(--ink); background: var(--paper);
  background-image: linear-gradient(180deg, #e9e9fc 0, var(--paper) 440px);
  border: 1px solid var(--line); border-radius: 18px;
  padding: clamp(20px, 4vw, 56px); margin: 8px 0 40px; overflow: hidden;
}
html.dark .td {
  --ink: #ecedf3; --soft: #9da2b3; --paper: #0f1117; --card: #181b24; --line: #262a36;
  --accent: #8d8ef7; --deep: #b4b5fb; --tint: #23244a; --notice: #2b2416; --noticeInk: #f5be62;
  background-image: linear-gradient(180deg, #1a1b33 0, var(--paper) 440px);
}
.td h1, .td h2, .td h3, .td p { margin: 0; color: inherit; word-break: keep-all; overflow-wrap: break-word; }
.td a { text-decoration: none; }
.td section + section { margin-top: clamp(48px, 7vw, 88px); }
.td-h2 { font-weight: 800; font-size: clamp(1.45rem, 3vw, 2rem); line-height: 1.3; margin-bottom: 10px !important; letter-spacing: -.01em; }
.td-h2 span { color: var(--accent); }
.td-sub { color: var(--soft); line-height: 1.8; max-width: 44em; margin-bottom: 24px !important; }
.td-note { margin-top: 14px !important; font-size: .88rem; color: var(--soft); line-height: 1.7; }

/* Hero */
.td-hero { display: grid; grid-template-columns: 1.15fr 1fr; gap: clamp(20px, 4vw, 52px); align-items: center; }
.td-kicker { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; color: var(--deep); }
.td-kicker img { width: 44px; height: 44px; border-radius: 11px; margin: 0 !important; box-shadow: 0 4px 12px rgba(91,91,214,.3); }
.td-title { font-weight: 800; font-size: clamp(2rem, 4.8vw, 3.2rem); line-height: 1.2; letter-spacing: -.02em; margin: 18px 0 16px !important; }
.td-title em { font-style: normal; color: var(--accent); }
.td-lead { font-size: 1.08rem; line-height: 1.85; color: var(--soft); max-width: 32em; }
.td-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 26px; }
.td-btn {
  display: inline-flex; flex-direction: column; justify-content: center; min-height: 54px; padding: 8px 22px;
  border-radius: 14px; background: var(--accent); color: #fff !important; font-weight: 700; font-size: 1.02rem; line-height: 1.2;
  box-shadow: 0 6px 16px rgba(91,91,214,.3); transition: transform .12s, box-shadow .12s;
}
html.dark .td-btn { color: #0f1117 !important; }
.td-btn small { font-size: .7rem; font-weight: 600; letter-spacing: .04em; opacity: .85; }
.td-btn:hover { transform: translateY(-2px); }
.td-btn-off, html.dark .td-btn-off { background: transparent; color: var(--deep) !important; border: 2px dashed var(--line); box-shadow: none; cursor: default; }
.td-btn-off:hover { transform: none; }
.td-btn-ghost, html.dark .td-btn-ghost { background: var(--card); color: var(--deep) !important; border: 1px solid var(--line); box-shadow: none; }
.td-platforms { margin-top: 16px !important; font-size: .88rem; color: var(--soft); line-height: 1.7; }
.td-hero-shot { margin: 0; display: flex; flex-direction: column; align-items: center; }
.td-phone { width: min(290px, 100%); border-radius: 38px; padding: 9px; background: #111318; box-shadow: 0 24px 50px rgba(25,27,35,.22); }
.td-phone img { display: block; width: 100%; height: auto; border-radius: 30px; margin: 0 !important; }
.td-phone-sm { width: min(230px, 100%); border-radius: 32px; padding: 7px; box-shadow: 0 14px 30px rgba(25,27,35,.16); }
.td-phone-sm img { border-radius: 26px; }
.td-caption { margin-top: 14px !important; font-size: .85rem; color: var(--soft); text-align: center; }

/* Speech example */
.td-speech { max-width: 560px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 22px; }
.td-quote { font-size: 1.05rem; line-height: 1.7; font-weight: 600; }
.td-arrow { display: block; text-align: center; color: var(--accent); font-weight: 800; margin: 10px 0; }
.td-mini { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.td-mini li { display: flex; gap: 12px; align-items: flex-start; padding: 12px; border-radius: 12px; background: var(--paper); }
.td-check { flex: none; width: 20px; height: 20px; border-radius: 10px; border: 2px solid var(--accent); margin-top: 2px; }
.td-mini b { display: block; }
.td-mini small { display: inline-flex; align-items: center; gap: 6px; color: var(--soft); font-size: .85rem; }
.td-dot { width: 8px; height: 8px; border-radius: 4px; display: inline-block; }

/* Features */
.td-feats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; list-style: none; padding: 0; margin: 0; }
.td-feat { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; }
.td-feat-icon { display: inline-flex; width: 38px; height: 38px; align-items: center; justify-content: center; border-radius: 10px; background: var(--tint); color: var(--accent); font-weight: 800; }
.td-feat h3 { font-size: 1.02rem; font-weight: 800; margin: 12px 0 6px !important; }
.td-feat p { color: var(--soft); line-height: 1.7; font-size: .93rem; }

/* Looks */
.td-looks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
.td-looks figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; }
.td-looks figcaption { font-size: .9rem; color: var(--soft); line-height: 1.6; }
.td-looks figcaption b { display: block; color: var(--ink); }

/* Storage */
.td-stores { margin: 0; display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.td-stores > div { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; }
.td-stores dt { font-weight: 800; margin-bottom: 4px; }
.td-stores dd { margin: 0; color: var(--soft); line-height: 1.65; font-size: .93rem; }

/* Price */
.td-receipt { max-width: 640px; margin-left: auto; margin-right: auto; }
.td-receipt dl { margin: 0; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 6px 22px; }
.td-receipt dl > div { display: flex; justify-content: space-between; gap: 16px; padding: 14px 0; border-top: 1px dashed var(--line); }
.td-receipt dl > div:first-child { border-top: 0; }
.td-receipt dt { font-weight: 700; }
.td-receipt dt span { display: block; font-weight: 400; font-size: .88rem; color: var(--soft); margin-top: 2px; }
.td-receipt dd { margin: 0; font-weight: 800; color: var(--deep); white-space: nowrap; }

/* Close */
.td-end { text-align: center; display: flex; flex-direction: column; align-items: center; }
.td-promise { font-size: clamp(1.15rem, 2.4vw, 1.4rem); font-weight: 700; line-height: 1.6; max-width: 28em; }
.td-end .td-cta { justify-content: center; }
.td-links { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 20px; margin-top: 22px; font-size: .92rem; }
.td-links a { color: var(--deep); font-weight: 600; }

@media (max-width: 860px) {
  .td-hero { grid-template-columns: 1fr; }
  .td-feats { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 600px) {
  .td-feats, .td-stores { grid-template-columns: 1fr; }
  .td-looks { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { .td-btn { transition: none; } }
</style>
