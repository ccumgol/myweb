<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Jua&display=swap" rel="stylesheet">
<style>
.sb {
  --mat: #fff4e2; --ink: #2b2118; --soft: #6b5a4c; --tray: #2f333b; --hole: #1a1c21;
  --paper: #fffdf8; --line: #2b2118; --yolk: #ffb703; --red: #e8505b;
  --round: "Fredoka", "Jua", ui-rounded, system-ui, sans-serif;
  background: var(--mat); color: var(--ink);
  border: 3px solid var(--line); border-radius: 28px;
  padding: clamp(20px, 4vw, 56px); margin: 8px 0 40px;
  background-image: radial-gradient(circle, rgba(43,33,24,.07) 1.5px, transparent 1.6px);
  background-size: 22px 22px; overflow: hidden;
}
html.dark .sb {
  --mat: #241c17; --ink: #fff1dc; --soft: #cdb9a5; --tray: #3a3f48; --hole: #15171b;
  --paper: #2f2520; --line: #fff1dc;
  background-image: radial-gradient(circle, rgba(255,241,220,.06) 1.5px, transparent 1.6px);
}
.sb h1, .sb h2, .sb h3, .sb p { margin: 0; color: inherit; }
.sb a { text-decoration: none; }
.sb-h2 { font-family: var(--round); font-weight: 700; font-size: clamp(1.6rem, 3.4vw, 2.3rem); line-height: 1.15; margin-bottom: 18px !important; }

/* Hero */
.sb-hero { display: grid; grid-template-columns: .9fr 1.1fr; gap: clamp(16px, 4vw, 48px); align-items: center; }
.sb-kicker { display: inline-flex; align-items: center; gap: 10px; font-family: var(--round); font-weight: 600; font-size: 1.15rem; }
.sb-kicker img { border-radius: 12px; border: 2px solid var(--line); margin: 0 !important; }
.sb-title { font-family: var(--round); font-weight: 700; font-size: clamp(2.3rem, 6vw, 4.2rem); line-height: 1.02; letter-spacing: -.01em; margin: 18px 0 16px !important; }
.sb-title em { font-style: normal; color: var(--red); }
.sb-title b { font-weight: inherit; background: var(--yolk); color: #2b2118; padding: 0 .12em; border-radius: .18em; }
.sb-lead { font-size: 1.12rem; line-height: 1.7; color: var(--soft); max-width: 34em; }
.sb-cta { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 26px; }
.sb-btn {
  display: inline-flex; flex-direction: column; justify-content: center; min-height: 58px;
  padding: 8px 22px; border: 3px solid var(--line); border-radius: 18px;
  background: var(--ink); color: var(--mat) !important; font-family: var(--round); font-weight: 600; font-size: 1.2rem; line-height: 1.15;
  box-shadow: 5px 5px 0 var(--yolk); transition: transform .12s, box-shadow .12s;
}
.sb-btn small { font-size: .74rem; font-weight: 500; opacity: .85; }
.sb-btn:hover { transform: translate(-2px, -2px); box-shadow: 7px 7px 0 var(--yolk); }
.sb-btn:active { transform: translate(3px, 3px); box-shadow: 2px 2px 0 var(--yolk); }
.sb-btn-off { background: transparent; color: var(--ink) !important; border-style: dashed; box-shadow: none; cursor: default; }
.sb-btn-off:hover { transform: none; box-shadow: none; }
.sb-platforms { margin-top: 14px !important; font-size: .9rem; color: var(--soft); }

.sb-board { width: 100%; max-width: 580px; justify-self: center; overflow: visible; filter: drop-shadow(6px 8px 0 rgba(43,33,24,.18)); }
.sb-tray { fill: var(--tray); }
.sb-hole { fill: var(--hole); }

/* Playable board */
.sb-play { position: relative; justify-self: center; width: 100%; max-width: 580px; }
.sb-play .sb-board { max-width: none; }
.sb-play-badge { display: none; }
.sb-play.is-live .sb-play-badge {
  display: inline-block; position: absolute; left: 4px; top: -6px; z-index: 2; transform: rotate(-8deg);
  background: var(--red); color: #fff; font-family: var(--round); font-weight: 700; font-size: .95rem;
  padding: 6px 12px; border: 3px solid var(--line); border-radius: 12px; box-shadow: 3px 3px 0 var(--line);
}
.sb-traybox { fill: rgba(43,33,24,.05); stroke: var(--soft); stroke-width: 2.5; stroke-dasharray: 8 8; }
html.dark .sb-traybox { fill: rgba(255,241,220,.05); }
.sb-loose { cursor: grab; touch-action: none; }
.sb-loose.is-selected { filter: drop-shadow(0 0 0 var(--yolk)) drop-shadow(0 0 6px var(--yolk)); }
.sb-loose.is-dragging { cursor: grabbing; filter: drop-shadow(5px 9px 0 rgba(0,0,0,.28)); }
.sb-loose.just-placed { animation: sb-pop .32s ease-out; transform-box: fill-box; transform-origin: center; }
@keyframes sb-pop { 0% { opacity: .6; } 50% { opacity: 1; } }
.sb-ghost { opacity: .35; pointer-events: none; }
.sb-play-bar { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 4px; }
.sb-play-bar button {
  font-family: var(--round); font-weight: 600; font-size: 1rem; color: var(--ink); background: var(--paper);
  border: 2.5px solid var(--line); border-radius: 12px; padding: 6px 14px; box-shadow: 3px 3px 0 var(--line); cursor: pointer;
}
.sb-play-bar button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--line); }
.sb-play-msg { text-align: center; min-height: 3em; margin-top: 10px !important; font-weight: 600; color: var(--soft); line-height: 1.5; }
.sb-won .sb-play-msg { color: var(--ink); }
.sb-play-msg a { color: var(--ink) !important; border-bottom: 3px solid var(--yolk); white-space: nowrap; }
.sb-won .sb-board { animation: sb-cheer .7s ease-in-out 2; }
@keyframes sb-cheer { 25% { transform: rotate(-2deg) scale(1.02); } 75% { transform: rotate(2deg) scale(1.02); } }
.sb-wonmark { animation: sb-stamp .45s cubic-bezier(.3,1.6,.5,1) both; transform-box: fill-box; transform-origin: center; }
.sb-wonmark rect { fill: var(--yolk); stroke: #2b2118; stroke-width: 4; }
.sb-wonmark text { font-family: var(--round); font-weight: 700; font-size: 40px; text-anchor: middle; fill: #2b2118; }
@keyframes sb-stamp { 0% { transform: scale(2.2) rotate(-12deg); opacity: 0; } 100% { transform: scale(1) rotate(-6deg); opacity: 1; } }

/* News ticket */
.sb-ticket {
  display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 18px;
  margin: clamp(32px, 6vw, 64px) 0 0; padding: 16px 24px; background: var(--yolk); color: #2b2118;
  border: 3px solid var(--line); border-radius: 14px; transform: rotate(-1.2deg);
  box-shadow: 6px 6px 0 var(--line);
  -webkit-mask: radial-gradient(circle 12px at 0 50%, transparent 98%, #000) left / 51% 100% no-repeat,
                radial-gradient(circle 12px at 100% 50%, transparent 98%, #000) right / 51% 100% no-repeat;
}
.sb-ticket-date { font-family: var(--round); font-weight: 700; font-size: .95rem; border-right: 3px dashed #2b2118; padding-right: 18px; }
.sb-ticket-main { font-family: var(--round); font-weight: 700; font-size: clamp(1.15rem, 2.6vw, 1.5rem); }
.sb-ticket-side { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: .95rem; }
.sb-dots { display: inline-flex; gap: 4px; }
.sb-dots i { width: 9px; height: 9px; border-radius: 50%; background: #2b2118; animation: sb-bounce 1.2s infinite; }
.sb-dots i:nth-child(2) { animation-delay: .15s; } .sb-dots i:nth-child(3) { animation-delay: .3s; }
@keyframes sb-bounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }

/* Sticker table */
.sb-table { display: flex; justify-content: center; align-items: flex-start; flex-wrap: wrap; gap: 0; margin: clamp(40px, 7vw, 80px) 0; padding: 0 8px; }
.sb-sticker { width: clamp(150px, 22%, 210px); margin: 0 -10px 20px !important; background: var(--paper); padding: 8px 8px 0; border: 3px solid var(--line); border-radius: 22px; box-shadow: 5px 6px 0 rgba(43,33,24,.25); transition: transform .2s; position: relative; }
.sb-sticker img { border-radius: 14px; margin: 0 !important; width: 100%; height: auto; }
.sb-sticker figcaption { font-family: var(--round); font-weight: 600; text-align: center; padding: 8px 0 10px; font-size: .95rem; }
.sb-sticker-0 { transform: rotate(-6deg) translateY(18px); z-index: 1; }
.sb-sticker-1 { transform: rotate(3deg); z-index: 2; }
.sb-sticker-2 { transform: rotate(-2deg) translateY(28px); z-index: 3; }
.sb-sticker-3 { transform: rotate(5deg) translateY(6px); z-index: 2; }
.sb-sticker:hover { transform: rotate(0) translateY(-8px) scale(1.04); z-index: 5; }

/* Feature pieces */
.sb-piece-list { list-style: none; padding: 0 !important; margin: 0 !important; display: grid; grid-template-columns: repeat(2, 1fr); gap: 34px 48px; }
.sb-piece { display: grid; grid-template-columns: 88px 1fr; gap: 18px; align-items: start; margin: 0 !important; }
.sb-piece:nth-child(even) { transform: translateY(28px); }
.sb-piece-shape { width: 88px; height: 88px; }
.sb-piece h3 { font-family: var(--round); font-weight: 700; font-size: 1.3rem; margin-bottom: 6px !important; }
.sb-piece p { color: var(--soft); line-height: 1.65; }

/* Receipt */
.sb-receipt { max-width: 560px; margin: clamp(70px, 9vw, 110px) auto 0; background: var(--paper); border: 3px solid var(--line); padding: 28px 28px 22px; transform: rotate(1deg); box-shadow: 6px 6px 0 var(--line);
  -webkit-mask: conic-gradient(from 135deg at top, #0000, #000 1deg 89deg, #0000 90deg) top / 18px 51% repeat-x,
                conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom / 18px 51% repeat-x; padding-top: 34px; padding-bottom: 30px; }
.sb-receipt .sb-h2 { text-align: center; }
.sb-receipt dl { margin: 0; }
.sb-receipt dl div { display: flex; justify-content: space-between; gap: 16px; padding: 14px 0; border-bottom: 2px dashed var(--soft); }
.sb-receipt dt { font-family: var(--round); font-weight: 600; font-size: 1.15rem; }
.sb-receipt dt span { display: block; font-family: inherit; font-weight: 400; font-size: .92rem; color: var(--soft); margin-top: 3px; line-height: 1.5; }
.sb-receipt dd { margin: 0; font-family: var(--round); font-weight: 700; font-size: 1.35rem; white-space: nowrap; }
.sb-receipt-foot { text-align: center; margin-top: 14px !important; font-size: .9rem; color: var(--soft); }

/* Mac */
.sb-mac { display: grid; grid-template-columns: .8fr 1.2fr; gap: clamp(20px, 4vw, 48px); align-items: center; margin-top: clamp(70px, 9vw, 110px); }
.sb-mac-copy p { color: var(--soft); line-height: 1.7; }
.sb-window { position: relative; border: 3px solid var(--line); border-radius: 16px; overflow: hidden; background: var(--paper); box-shadow: 8px 8px 0 rgba(43,33,24,.25); transform: rotate(-1.5deg); }
.sb-window-bar { display: flex; gap: 7px; padding: 9px 12px; border-bottom: 3px solid var(--line); }
.sb-window-bar i { width: 12px; height: 12px; border-radius: 50%; background: var(--red); }
.sb-window-bar i:nth-child(2) { background: var(--yolk); } .sb-window-bar i:nth-child(3) { background: #3cb371; }
.sb-window img { display: block; margin: 0 !important; width: 100%; height: auto; filter: saturate(.85); }
.sb-tape { position: absolute; right: -54px; top: 34px; transform: rotate(32deg); width: 240px; text-align: center; padding: 7px 0; font-family: var(--round); font-weight: 700; color: #2b2118;
  background: repeating-linear-gradient(-45deg, #ffb703 0 16px, #2b2118 16px 18px, #ffb703 18px 34px); border-block: 3px solid #2b2118; }

/* End */
.sb-end { text-align: center; margin-top: clamp(70px, 9vw, 110px); display: flex; flex-direction: column; align-items: center; gap: 22px; }
.sb-promise { font-family: var(--round); font-weight: 600; font-size: clamp(1.2rem, 2.8vw, 1.6rem); max-width: 26em; line-height: 1.4; }
.sb-links { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 22px; }
.sb-links a { color: var(--ink) !important; font-weight: 600; border-bottom: 3px solid var(--yolk); padding-bottom: 1px; }

@media (max-width: 760px) {
  .sb-hero, .sb-mac { grid-template-columns: 1fr; }
  .sb-board { max-width: 100%; order: -1; }
  .sb-ticket { grid-template-columns: 1fr; gap: 6px; transform: rotate(-1deg); }
  .sb-ticket-date { border-right: 0; padding-right: 0; }
  .sb-piece-list { grid-template-columns: 1fr; gap: 26px; }
  .sb-piece:nth-child(even) { transform: none; }
  .sb-piece { grid-template-columns: 64px 1fr; }
  .sb-piece-shape { width: 64px; height: 64px; }
  .sb-sticker { width: 45%; margin: 0 2% 18px !important; }
  .sb-sticker figcaption { font-size: .85rem; }
  .sb-tape { right: -62px; top: 22px; font-size: .85rem; }
}
@media (prefers-reduced-motion: reduce) {
  .sb-dots i, .sb-loose.just-placed, .sb-won .sb-board, .sb-wonmark { animation: none; }
  .sb-btn, .sb-sticker { transition: none; }
}
</style>
