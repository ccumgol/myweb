<style>
.qcorner { --q-line:#e5e5ea; --q-soft:#f5f5f7; --q-muted:#8a8a8e; --q-accent:#2b6cb0; --q-card:#fff; }
.dark .qcorner { --q-line:#3a3a3f; --q-soft:#26262b; --q-muted:#9a9aa0; --q-accent:#7db1e8; --q-card:#2f2f35; }

/* ---- interactive map ---- */
.q-map-wrap { display:grid; grid-template-columns: 1.6fr 1fr; gap:22px; align-items:start; margin:26px 0 10px; }
@media (max-width:820px){ .q-map-wrap{ grid-template-columns:1fr; } }
#us-map { width:100%; height:auto; display:block; }
#us-map path { fill:#cfd8e3; stroke:#fff; stroke-width:1; transition:fill .15s ease; }
.dark #us-map path { fill:#4a5568; stroke:#2f2f35; }
#us-map path.has-coin { cursor:pointer; fill:#a9c3e0; }
.dark #us-map path.has-coin { fill:#5a7fa8; }
#us-map path.has-coin:hover { fill:var(--q-accent); }
#us-map path.active { fill:var(--q-accent) !important; }

.q-panel { border:1px solid var(--q-line); border-radius:14px; padding:16px; background:var(--q-card); min-height:220px; }
.q-panel .ph { color:var(--q-muted); font-size:.95rem; line-height:1.6; }
.q-panel h3 { margin:0 0 12px; font-size:1.15rem; font-weight:700; }
.q-pcoin { display:flex; gap:12px; align-items:center; padding:9px 0; border-top:1px solid var(--q-line); text-decoration:none; color:inherit; }
.q-pcoin:first-of-type{ border-top:none; }
.q-pcoin img { width:64px; height:64px; object-fit:contain; flex:none; }
.q-pcoin .s { font-size:.72rem; color:var(--q-accent); font-weight:600; }
.q-pcoin .t { font-weight:600; font-size:.98rem; }
.q-pcoin .y { font-size:.78rem; color:var(--q-muted); }

/* ---- series galleries ---- */
.q-series { margin-top:40px; }
.q-series h2 { font-size:1.4rem; font-weight:800; margin:0 0 4px; }
.q-series .cnt { font-size:.9rem; color:var(--q-muted); font-weight:500; }
.q-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:14px; margin-top:14px; }
.q-card { background:var(--q-card); border:1px solid var(--q-line); border-radius:12px; padding:12px; text-align:center; text-decoration:none; color:inherit; transition:transform .12s ease, box-shadow .12s ease; }
.q-card:hover { transform:translateY(-3px); box-shadow:0 6px 18px rgba(0,0,0,.08); }
.q-card img { width:104px; height:104px; object-fit:contain; display:block; margin-inline:auto; }
.q-card .t { font-size:.82rem; font-weight:600; margin-top:6px; line-height:1.35; }
.q-card .m { font-size:.72rem; color:var(--q-muted); margin-top:2px; }

/* ---- single coin ---- */
.q-single { max-width:720px; }
.q-hero { text-align:center; background:var(--q-soft); border-radius:16px; padding:24px; }
.q-hero img { width:230px; max-width:70%; height:auto; display:block; margin-inline:auto; cursor:zoom-in; }
.q-badge { display:inline-block; font-size:.78rem; font-weight:700; color:#fff; background:var(--q-accent); border-radius:999px; padding:3px 11px; }
.q-summary { font-size:1.12rem; font-weight:600; margin:18px 0 6px; }
.q-facts { display:flex; flex-wrap:wrap; gap:8px 18px; padding:14px 16px; background:var(--q-soft); border-radius:12px; margin:16px 0; font-size:.95rem; }
.q-facts b { color:var(--q-accent); margin-right:5px; }
.q-rev { border-left:3px solid var(--q-accent); background:var(--q-soft); border-radius:0 10px 10px 0; padding:10px 14px; margin:18px 0; font-size:.95rem; }
.q-cred { margin-top:26px; padding-top:12px; border-top:1px solid var(--q-line); font-size:.78rem; color:var(--q-muted); }
.q-back { display:inline-block; margin:6px 0 2px; font-size:.9rem; color:var(--q-accent); text-decoration:none; }

/* ---- series anchor offset (fixed header clearance) ---- */
.q-series { scroll-margin-top:90px; }

/* ---- coin-series hub (/coins/) ---- */
.q-hub { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:16px; }
.q-hub-card { display:flex; align-items:center; gap:16px; background:var(--q-card); border:1px solid var(--q-line); border-radius:14px; padding:20px; text-decoration:none; color:inherit; transition:transform .12s ease, box-shadow .12s ease; }
.q-hub-card:hover { transform:translateY(-3px); box-shadow:0 6px 18px rgba(0,0,0,.08); }
.q-hub-emoji { font-size:2.2rem; line-height:1; }
.q-hub-title { font-size:1.15rem; font-weight:700; }
.q-hub-desc { font-size:.9rem; color:var(--q-muted); margin-top:4px; line-height:1.5; }
.q-hub-soon { opacity:.55; cursor:default; }
</style>
<script>
/* Clear any stuck medium-zoom overlay when returning via browser bfcache
   (fixes: big coin image lingering after back navigation). */
(function () {
  function clearZoom() {
    document.querySelectorAll(".medium-zoom-overlay").forEach(function (el) { el.remove(); });
    document.querySelectorAll(".medium-zoom-image--opened, .medium-zoom-image--hidden").forEach(function (img) {
      img.classList.remove("medium-zoom-image--opened", "medium-zoom-image--hidden");
      img.style.transform = "";
      img.style.visibility = "";
    });
    document.documentElement.classList.remove("medium-zoom--opened");
  }
  window.addEventListener("pageshow", function (e) { if (e.persisted) clearZoom(); });
  window.addEventListener("pagehide", clearZoom);
})();
</script>
