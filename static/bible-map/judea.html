<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>유대 사역 — 지도로 보는 예수님의 생애</title>
<style>
:root{
 --paper:#f4efe6;--ink:#2b2622;--soft:#5b5148;--muted:#8a7f73;--accent:#b5623a;--accentd:#8f4a2c;
 --card:#fffdf8;--rule:#e3dccf;--ridge:#cdbd97;--water:#9db9c4;--wall:#d8c9a8;--wallst:#b09a6f;--temple:#d9b98a;
 --serif:"Nanum Myeongjo","AppleMyungjo",serif;--sans:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
 --paper:#1a1712;--ink:#ece5d8;--soft:#b9afa0;--muted:#8f8474;--accent:#d1794f;--accentd:#e0895d;
 --card:#221d17;--rule:#3a332a;--ridge:#4a4130;--water:#3a5560;--wall:#3f3626;--wallst:#6b5c40;--temple:#5a4730;
}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);overflow:hidden}
#app{display:flex;flex-direction:column;height:100vh}
header{padding:12px 18px;border-bottom:1px solid var(--rule);background:var(--card);display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;z-index:5}
header h1{font-family:var(--serif);font-size:1.28rem;font-weight:800}
header .sub{color:var(--muted);font-size:.85rem}
header .sub b{color:var(--accentd)}
#main{flex:1;display:flex;min-height:0}
#stage{position:relative;flex:1;min-width:0;background:radial-gradient(120% 120% at 50% 0,var(--card),var(--paper))}
#svg{width:100%;height:100%;touch-action:none;cursor:grab}
#svg.grab{cursor:grabbing}
.rgl{font-family:var(--serif);fill:var(--soft);font-size:20px;font-weight:700;pointer-events:none;
  opacity:.95;letter-spacing:.06em;paint-order:stroke;stroke:var(--card);stroke-width:4.5px;stroke-linejoin:round}
.rgl.sm{font-size:14px;font-weight:600}
.dot{cursor:pointer}
.dot circle.hit{fill:transparent}
.dot .ring{fill:var(--card);stroke-width:3}
/* 라벨·배지도 클릭 대상 — 지명 글씨를 눌러도 그 장소가 선택된다 */
.dot .lbl{font-family:var(--sans);font-size:14px;font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--card);stroke-width:5px;cursor:pointer}
.dot .badge{stroke:var(--card);stroke-width:2.5px;cursor:pointer}
.dot .leader{stroke:var(--muted);stroke-width:1.2px;opacity:.5;pointer-events:none}
.dot .bnum{font-family:var(--sans);font-size:11px;font-weight:800;fill:#fff;pointer-events:none}
.dot:hover .lbl{fill:var(--accentd)}
.dot.active .lbl{fill:var(--accentd)}
.dot.active .ring{stroke-width:5}
.dot.pulse .ring{animation:pulse 1.1s ease-out infinite}
@keyframes pulse{0%{r:var(--r)}50%{r:calc(var(--r) + 7px)}100%{r:var(--r)}}
#journey{fill:none;stroke:var(--accent);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;opacity:.4;stroke-dasharray:1.5 10}
#journey.hide{display:none}
/* controls */
.ctrl{position:absolute;left:14px;top:14px;display:flex;flex-direction:column;gap:6px;z-index:4}
.ctrl button{width:38px;height:38px;border:1px solid var(--rule);background:var(--card);color:var(--ink);border-radius:9px;font-size:1.1rem;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.ctrl button:hover{border-color:var(--accent);color:var(--accent)}
.mapcredit{position:absolute;left:12px;bottom:12px;z-index:4;font-size:.68rem;color:var(--muted);
  background:color-mix(in srgb,var(--card) 82%,transparent);border:1px solid var(--rule);
  border-radius:6px;padding:.25em .6em;max-width:52%;line-height:1.45}
.mapcredit:empty{display:none}
.mapcredit a{color:var(--accentd);text-decoration:none} .mapcredit a:hover{text-decoration:underline}
.legend{position:absolute;right:14px;top:14px;background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:10px 12px;font-size:.76rem;z-index:4;box-shadow:0 2px 8px rgba(0,0,0,.08);max-width:150px}
.legend b{display:block;font-size:.7rem;letter-spacing:.12em;color:var(--muted);margin-bottom:6px;text-transform:uppercase}
.legend .row{display:flex;align-items:center;gap:7px;margin:3px 0}
.legend .sw{width:12px;height:12px;border-radius:50%;flex:none;border:2px solid var(--card);box-shadow:0 0 0 1px var(--rule)}
/* panel */
#panel{width:340px;flex:none;border-left:1px solid var(--rule);background:var(--card);display:flex;flex-direction:column;min-height:0}
#panel .ph{padding:14px 16px;border-bottom:1px solid var(--rule)}
#panel .ph .cat{display:inline-block;font-size:.68rem;letter-spacing:.1em;color:#fff;padding:.15em .6em;border-radius:999px;font-weight:700}
#panel .ph h2{font-family:var(--serif);font-size:1.3rem;margin:.3em 0 .1em}
#panel .ph p{color:var(--muted);font-size:.85rem;line-height:1.5}
#panel .ph p.cnt{margin-top:.35em;font-size:.8rem;color:var(--soft)}
#panel .ph p.cnt b{color:var(--accentd);font-weight:800}
#panel .inside{margin-top:.6em;padding-top:.55em;border-top:1px dashed var(--rule)}
#panel .inside .il{display:block;font-size:.7rem;letter-spacing:.1em;color:var(--muted);font-weight:700;margin-bottom:.4em}
#panel .ichip{font:inherit;font-size:.76rem;color:var(--soft);background:var(--paper);border:1px solid var(--rules);
  border-radius:999px;padding:.2em .65em;margin:0 .25em .3em 0;cursor:pointer}
#panel .ichip:hover{border-color:var(--accent);color:var(--accentd)}
#panel .ichip b{color:var(--accentd);font-weight:800;margin-left:.15em}
#panel .ev .viab{display:inline-block;font-size:.7rem;color:var(--muted);background:var(--tint);
  border-radius:4px;padding:.05em .45em;margin:.15em 0 0}
#panel .prol{border-bottom:1px solid var(--rule);padding-bottom:.3em;margin-bottom:.3em}
#panel .prol .pl{display:block;font-size:.7rem;letter-spacing:.1em;color:var(--muted);font-weight:700;padding:6px 16px 2px}
.dot.edgenode .ring{stroke-dasharray:5 4}
#panel .body{overflow-y:auto;padding:8px 0}
.ev{display:block;width:100%;text-align:left;border:0;background:none;border-bottom:1px solid var(--rule);padding:11px 16px;cursor:pointer;font-family:inherit}
.ev:hover{background:var(--paper)}
.ev.cur{background:var(--paper);box-shadow:inset 4px 0 0 var(--accent)}
.ev .code{font-family:var(--serif);font-weight:800;color:var(--accentd);font-size:.82rem;margin-right:.4em}
.ev .t{font-weight:700;color:var(--ink);font-size:.95rem}
.ev .refs{margin-top:.35em;display:flex;flex-wrap:wrap;gap:.3em}
.ev .refs span,.ev .refs a.ref{font-size:.74rem;color:var(--soft);background:var(--paper);border:1px solid var(--rule);border-radius:5px;padding:.1em .5em}
.ev .refs a.ref{text-decoration:none;cursor:pointer}
.ev .refs a.ref:hover{border-color:var(--accent);color:var(--accentd);background:var(--tint)}
.ev .refs a.ref::after{content:"↗";font-size:.62rem;margin-left:.25em;opacity:.55}
/* 교재 목차 */
#panel .toc{border-bottom:1px solid var(--rule);padding:6px 0 8px;margin-bottom:.3em}
#panel .toc .tl{display:block;font-size:.7rem;letter-spacing:.1em;color:var(--muted);font-weight:700;padding:2px 16px 6px}
#panel .toc a{display:block;padding:5px 16px;text-decoration:none;color:var(--ink);font-size:.84rem;border-left:3px solid transparent}
#panel .toc a:hover{background:var(--tint);border-left-color:var(--accent)}
#panel .toc a .ln{font-family:var(--serif);font-weight:800;color:var(--accent);margin-right:.45em}
#panel .toc a .lc{display:block;font-size:.7rem;color:var(--muted);margin-left:1.6em}
.ev .studylink{display:inline-block;margin-top:.6em;font-size:.82rem;font-weight:700;color:#fff;background:var(--accent);border-radius:7px;padding:.4em .8em;text-decoration:none}
.ev .studylink:hover{background:var(--accentd)}
.hint{padding:16px;color:var(--muted);font-size:.85rem;line-height:1.6}
/* stepper */
#step{border-top:1px solid var(--rule);background:var(--card);padding:10px 14px;display:flex;align-items:center;gap:10px}
#step button{border:1px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:8px 12px;cursor:pointer;font-family:inherit;font-weight:700}
#step button:hover{border-color:var(--accent);color:var(--accent)}
#step .who{flex:1;min-width:0;font-size:.85rem}
#step .who b{font-family:var(--serif);color:var(--accentd)}
#step .who .tt{font-weight:700}
#step .prog{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.8rem}
@media (max-width:820px){
 #main{flex-direction:column} #panel{width:auto;height:44%;border-left:0;border-top:1px solid var(--rule)}
 .legend{max-width:120px;font-size:.7rem}
}
</style></head><body>
<div id="app">
 <header>

     <div class="ph" id="ph"><h2>유대 사역</h2><p>지도의 점(장소)을 누르거나, 아래 <b>◀ ▶</b>로 예수님의 발자취를 순서대로 따라가 보세요.</p></div>
     <div class="body" id="pbody"><div class="hint">왼쪽 지도에서 장소를 선택하면 그곳에서 일어난 사건들이 여기 나타납니다.</div></div>

 </div>
</div>
<script>
const DATA = {"places": {"jerusalem": {"id": "jerusalem", "name": "예루살렘", "cat": "feast", "desc": "초막절과 수전절에 성전 뜰에서 가르치시고 논쟁하신 곳 — 세상의 빛·선한 목자·나와 아버지는 하나. 나면서 맹인 된 자가 눈을 씻은 실로암 못도 성 남쪽에 있다.", "x": 292.3, "y": 343.3, "lx": -88, "ly": -10, "n": 6}, "bethany": {"id": "bethany", "name": "베다니", "cat": "home", "desc": "마르다는 준비로 분주하고 마리아는 발 앞에 앉은 집 — 감람산 동편 마을.", "x": 326.7, "y": 355.0, "lx": 76, "ly": 22, "n": 1}, "judea": {"id": "judea", "name": "유대 여러 마을", "cat": "tour", "desc": "칠십 인을 앞서 보내시고 두루 다니며 가르치신 유대 지방 — 지명이 밝혀지지 않은 사건들.", "x": 100.0, "y": 540.0, "lx": 0, "ly": 26, "n": 13}, "jericho": {"id": "jericho", "name": "여리고 길", "cat": "parable", "desc": "선한 사마리아인 비유의 무대 — 예루살렘에서 여리고로 내려가는 험한 길.", "x": 533.3, "y": 273.3, "lx": 84, "ly": -8, "n": 1}, "perea": {"id": "perea", "name": "요단 동편", "cat": "move", "desc": "수전절 논쟁 뒤 잡히려는 손을 벗어나 요한이 처음 세례를 주던 곳으로 물러가신 자리.", "x": 900.0, "y": 140.0, "lx": -88, "ly": 8, "n": 1}, "galilee": {"id": "galilee", "name": "갈릴리", "cat": "move", "desc": "형제들이 명절에 올라가라 권했을 때 아직 머무르신 곳 — 이 지도 범위 밖(북쪽).", "x": 128, "y": 62, "lx": 0, "ly": 26, "n": 1, "edge": true}}, "events": [{"code": "E-01", "title": "예루살렘으로 가기를 미루시다", "place": "galilee", "refs": {"요": "요 7:1-9"}, "study": "study/F01.html"}, {"code": "E-02", "title": "초막절에 성전에서 논쟁하시다", "place": "jerusalem", "refs": {"요": "요 7:10-52"}, "study": "study/F01.html"}, {"code": "E-03", "title": "간음한 여인을 용서하시다", "place": "jerusalem", "refs": {"요": "요 7:53-8:11"}, "study": "study/F02.html"}, {"code": "E-04", "title": "나는 세상의 빛이라 하시다", "place": "jerusalem", "refs": {"요": "요 8:12-59"}, "study": "study/F03.html"}, {"code": "E-05", "title": "나면서 맹인 된 자를 고치시다", "place": "jerusalem", "refs": {"요": "요 9:1-41"}, "study": "study/F04.html"}, {"code": "E-06", "title": "나는 선한 목자라 하시다", "place": "jerusalem", "refs": {"요": "요 10:1-21"}, "study": "study/F05.html"}, {"code": "E-07", "title": "칠십 인을 보내시다", "place": "judea", "refs": {"눅": "눅 10:1-24"}, "study": "study/F06.html"}, {"code": "E-08", "title": "선한 사마리아인의 비유", "place": "jericho", "refs": {"눅": "눅 10:25-37"}, "study": "study/F07.html"}, {"code": "E-09", "title": "마르다와 마리아의 집에 드시다", "place": "bethany", "refs": {"눅": "눅 10:38-42"}, "study": "study/F08.html"}, {"code": "E-10", "title": "기도를 가르치시다", "place": "judea", "refs": {"마": "마 6:9-15", "눅": "눅 11:1-13"}, "study": "study/F09.html"}, {"code": "E-11", "title": "바알세불 시비에 답하시다", "place": "judea", "refs": {"눅": "눅 11:14-26"}, "study": "study/F09.html"}, {"code": "E-12", "title": "참으로 복 있는 자", "place": "judea", "refs": {"눅": "눅 11:27-28"}, "study": "study/F09.html"}, {"code": "E-13", "title": "요나의 표적", "place": "judea", "refs": {"눅": "눅 11:29-36"}, "study": "study/F09.html"}, {"code": "E-14", "title": "바리새인과 율법사를 책망하시다", "place": "judea", "refs": {"눅": "눅 11:37-54"}, "study": "study/F10.html"}, {"code": "E-15", "title": "바리새인의 누룩을 경계하시다", "place": "judea", "refs": {"눅": "눅 12:1-12"}, "study": "study/F10.html"}, {"code": "E-16", "title": "어리석은 부자의 비유", "place": "judea", "refs": {"눅": "눅 12:13-21"}, "study": "study/F11.html"}, {"code": "E-17", "title": "까마귀와 백합화를 보라", "place": "judea", "refs": {"눅": "눅 12:22-34"}, "study": "study/F11.html"}, {"code": "E-18", "title": "깨어 준비하는 종", "place": "judea", "refs": {"눅": "눅 12:35-48"}, "study": "study/F12.html"}, {"code": "E-19", "title": "불과 분쟁, 그리고 이 시대를 분별하라", "place": "judea", "refs": {"눅": "눅 12:49-59"}, "study": "study/F12.html"}, {"code": "E-20", "title": "열매 없는 무화과나무의 비유", "place": "judea", "refs": {"눅": "눅 13:1-9"}, "study": "study/F12.html"}, {"code": "E-21", "title": "안식일에 등 굽은 여인을 고치시다", "place": "judea", "refs": {"눅": "눅 13:10-17"}, "study": "study/F12.html"}, {"code": "E-22", "title": "수전절 — 나와 아버지는 하나", "place": "jerusalem", "refs": {"요": "요 10:22-42"}, "also": ["perea"], "study": "study/F13.html"}], "lessons": [{"id": "F01", "title": "내 때가 아직 — 초막절의 논쟁", "events": ["E-01", "E-02"]}, {"id": "F02", "title": "돌을 들지 못한 사람들 — 간음한 여인", "events": ["E-03"]}, {"id": "F03", "title": "나는 세상의 빛이라", "events": ["E-04"]}, {"id": "F04", "title": "눈을 씻고 보게 된 사람", "events": ["E-05"]}, {"id": "F05", "title": "나는 선한 목자라", "events": ["E-06"]}, {"id": "F06", "title": "칠십 인을 보내시다", "events": ["E-07"]}, {"id": "F07", "title": "누가 내 이웃인가 — 선한 사마리아인", "events": ["E-08"]}, {"id": "F08", "title": "한 가지만이라도 — 마르다와 마리아", "events": ["E-09"]}, {"id": "F09", "title": "이렇게 기도하라 — 구하는 자에게", "events": ["E-10", "E-11", "E-12", "E-13"]}, {"id": "F10", "title": "외식의 누룩 — 책망과 경계", "events": ["E-14", "E-15"]}, {"id": "F11", "title": "어리석은 부자, 까마귀와 백합화", "events": ["E-16", "E-17"]}, {"id": "F12", "title": "깨어 준비하라 — 이 시대를 분별하라", "events": ["E-18", "E-19", "E-20", "E-21"]}, {"id": "F13", "title": "나와 아버지는 하나이니라", "events": ["E-22"]}], "cats": {"feast": {"label": "명절의 논쟁", "color": "#8a5a12"}, "home": {"label": "집에서", "color": "#a8442a"}, "tour": {"label": "순회·파송", "color": "#6b6b6b"}, "parable": {"label": "비유", "color": "#7d5aa0"}, "move": {"label": "이동", "color": "#3f6f9c"}}};
const P = DATA.places, EV = DATA.events, CATS = DATA.cats;
const $ = s=>document.querySelector(s);
const svg=$('#svg'), cam=$('#cam'), dotsG=$('#dots'), journey=$('#journey');
document.getElementById('ec').textContent = '전 '+EV.length+'개 사건';

// legend
const lg=$('#legend');
for(const k in CATS){const c=CATS[k];const d=document.createElement('div');d.className='row';
  d.innerHTML='<span class="sw" style="background:'+c.color+'"></span>'+c.label;lg.appendChild(d);}

// journey path (연속 같은 장소는 건너뜀)
let dseq=[], last=null;
EV.forEach(e=>{if(e.place!==last){const p=P[e.place];dseq.push(p.x+','+p.y);last=e.place;}});
journey.setAttribute('d','M '+dseq.join(' L '));

// dots
const NS='http://www.w3.org/2000/svg';
function el(n,a){const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);return e;}
const dotEls={};
Object.values(P).forEach(p=>{
  const r=8+Math.sqrt(p.n)*3.0, col=CATS[p.cat].color;
  const g=el('g',{class:'dot'+(p.edge?' edgenode':''),'data-p':p.id}); g.style.setProperty('--r',r+'px');
  g.appendChild(el('circle',{class:'hit',cx:p.x,cy:p.y,r:r+14}));
  const ring=el('circle',{class:'ring',cx:p.x,cy:p.y,r:r,stroke:col}); g.appendChild(ring);
  g.appendChild(el('circle',{cx:p.x,cy:p.y,r:Math.max(3,r-5),fill:col}));
  /* 점은 실제 좌표에 고정하고, 겹칠 때는 라벨만 비켜 놓는다(lx,ly) */
  const lx=p.x+(p.lx||0), ly=p.y-r-7+(p.ly||0);
  const t=el('text',{class:'lbl',x:lx,y:ly,'text-anchor':p.la||'middle'}); t.textContent=p.name; g.appendChild(t);
  if(p.lx||p.ly){ g.insertBefore(el('line',{class:'leader',x1:p.x,y1:p.y,x2:lx,y2:ly+4}), g.firstChild); }
  // 사건 수 배지 — 어느 장소에 사건이 많은지 한눈에
  const bx=p.x + r*0.78, by=p.y - r*0.78;
  g.appendChild(el('circle',{class:'badge',cx:bx,cy:by,r:9.5,fill:col}));
  const bt=el('text',{class:'bnum',x:bx,y:by+3.4,'text-anchor':'middle'}); bt.textContent=p.n; g.appendChild(bt);
  g.addEventListener('click',ev=>{ev.stopPropagation(); if(!dragged) selectPlace(p.id);});
  dotsG.appendChild(g); dotEls[p.id]=g;
});

// ── panel rendering ──
/* 구절 값에 이미 책 약칭이 들어 있으므로 키(b)를 덧붙이지 않는다(‘마 마 21:1’ 방지).
   구절을 누르면 대한성서공회 개역개정 본문을 새 창으로 연다(본문을 복제하지 않는다). */
const BOOKCODE={"마":"mat","막":"mrk","눅":"luk","요":"jhn","행":"act","롬":"rom",
 "창":"gen","출":"exo","레":"lev","민":"num","신":"deu","수":"jos","삿":"jdg","룻":"rut",
 "삼상":"1sa","삼하":"2sa","왕상":"1ki","왕하":"2ki","시":"psa","잠":"pro","전":"ecc",
 "사":"isa","렘":"jer","겔":"ezk","단":"dan","호":"hos","욜":"jol","암":"amo","욘":"jon",
 "미":"mic","합":"hab","습":"zep","학":"hag","슥":"zec","말":"mal","고전":"1co","고후":"2co",
 "갈":"gal","엡":"eph","빌":"php","골":"col","히":"heb","약":"jas","벧전":"1pe","벧후":"2pe","계":"rev"};
function bibleUrl(ref){
  const m=String(ref).match(/^([가-힣]+)\s*(\d+):(\d+)/); if(!m) return null;
  const c=BOOKCODE[m[1]]; if(!c) return null;
  return 'https://www.bskorea.or.kr/bible/korbibReadpage.php?version=GAE&book='+c+'&chap='+m[2]+'&sec='+m[3];
}
function refsHtml(refs){
  return '<div class="refs">'+Object.values(refs).map(v=>{
    const u=bibleUrl(v);
    return u ? '<a class="ref" href="'+u+'" target="_blank" rel="noopener" title="대한성서공회 개역개정 본문 열기">'+v+'</a>'
             : '<span>'+v+'</span>';
  }).join('')+'</div>';
}
function selectPlace(pid, curCode){
  const p=P[pid];
  const evs=EV.filter(e=>e.place===pid || (e.also||[]).includes(pid));
  const c=CATS[p.cat];
  let extra='';
  if(p.inside && p.inside.length){
    extra='<div class="inside"><span class="il">이 성 안의 장소</span>'+
      p.inside.map(q=>'<button class="ichip" data-go="'+q+'">'+P[q].name+
        ' <b>'+P[q].n+'</b></button>').join('')+'</div>';
  }
  $('#ph').innerHTML='<span class="cat" style="background:'+c.color+'">'+c.label+'</span>'+
    '<h2>'+p.name+'</h2><p>'+p.desc+'</p>'+
    '<p class="cnt">이곳의 사건 <b>'+evs.length+'</b>개</p>'+extra;
  $('#ph').querySelectorAll('.ichip').forEach(b=>b.addEventListener('click',()=>{
     const q=P[b.dataset.go]; selectPlace(q.id); centerOn(q.x,q.y,Math.max(scale,2.2));}));
  $('#pbody').innerHTML = evs.map(e=>
     '<div class="ev'+(e.code===curCode?' cur':'')+'" data-code="'+e.code+'" role="button" tabindex="0">'+
     '<span class="code">'+e.code+'</span><span class="t">'+e.title+'</span>'+
     (e.place!==pid?'<span class="viab">주요 장소: '+P[e.place].name+'</span>':'')+refsHtml(e.refs)+
     (e.study?'<a class="studylink" href="/bible-map/'+e.study+'" target="_blank">📖 사건별 성경공부 열기</a>':'')+
     '</div>').join('');
  $('#pbody').querySelectorAll('.ev').forEach(b=>b.addEventListener('click',ev=>{
     if(ev.target.closest('.studylink')) return;
     const i=EV.findIndex(e=>e.code===b.dataset.code); if(i>=0) goto(i);}));
  Object.values(dotEls).forEach(g=>g.classList.remove('active','pulse'));
  dotEls[pid].classList.add('active');
  // 새 장소를 고르면 목록을 처음부터 보여 준다(앞서 스크롤한 위치가 남지 않도록)
  if(!curCode) $('#pbody').scrollTop=0;
  // 좁은 화면에서는 패널이 지도 아래에 있으므로, 사건 목록이 보이도록 이동
  if(window.matchMedia('(max-width:820px)').matches)
    $('#panel').scrollIntoView({behavior:'smooth',block:'start'});
}

// ── stepper (여정 따라가기) ──
let idx=-1, dragged=false;
function goto(i){
  idx=(i+EV.length)%EV.length; const e=EV[idx]; const p=P[e.place];
  selectPlace(e.place, e.code);
  Object.values(dotEls).forEach(g=>g.classList.remove('pulse'));
  dotEls[e.place].classList.add('active','pulse');
  $('#who').innerHTML='<span class="tt"><b>'+e.code+'</b> '+e.title+'</span> · '+p.name;
  $('#prog').textContent=(idx+1)+' / '+EV.length;
  centerOn(p.x,p.y,1.7);
  const cur=$('#pbody .ev.cur'); if(cur) cur.scrollIntoView({block:'nearest'});
}
$('#next').onclick=()=>goto(idx+1);
$('#prev').onclick=()=>goto(idx-1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')goto(idx+1);if(e.key==='ArrowLeft')goto(idx-1);});

// ── pan / zoom ──
let scale=1,tx=0,ty=0;
function apply(){cam.setAttribute('transform','translate('+tx+' '+ty+') scale('+scale+')');}
function clamp(){scale=Math.max(0.7,Math.min(6,scale));}
function centerOn(x,y,s){scale=s;clamp();
  // transform is in viewBox units; put (x,y) at the viewBox centre
  tx=1000/2 - x*scale; ty=680/2 - y*scale; apply();}
function zoomAt(cx,cy,f){const nx=(cx-tx)/scale, ny=(cy-ty)/scale; scale*=f; clamp();
  tx=cx-nx*scale; ty=cy-ny*scale; apply();}
function svgPt(ev){const r=svg.getBoundingClientRect();
  return [ (ev.clientX-r.left)/r.width*1000, (ev.clientY-r.top)/r.height*680 ];}
$('#zin').onclick=()=>zoomAt(1000/2,680/2,1.25);
$('#zout').onclick=()=>zoomAt(1000/2,680/2,0.8);
$('#zrst').onclick=()=>{scale=1;tx=0;ty=0;apply();};
$('#jt').onclick=()=>journey.classList.toggle('hide');

/* 성경공부 목차(있을 때만) — 어느 과가 어느 사건을 다루는지 한눈에 */
if(DATA.lessons && DATA.lessons.length){
  $('#pbody').insertAdjacentHTML('afterbegin',
   '<div class="toc"><span class="tl">성경공부 목차 · 전 '+DATA.lessons.length+'과</span>'+
   DATA.lessons.map((L,i)=>'<a href="/bible-map/study/'+L.id+'.html" target="_blank" rel="noopener">'+
     '<span class="ln">'+(i+1)+'과</span>'+L.title+
     '<span class="lc">'+L.events.join(' · ')+'</span></a>').join('')+'</div>');
}

/* 장소가 없는 '서론' 사건(있을 때만) — 초기 패널에 카드로 안내 */
if(DATA.prologue && DATA.prologue.length){
  $('#pbody').insertAdjacentHTML('afterbegin',
   '<div class="prol"><span class="pl">서론 · 특정 장소가 없는 본문</span>'+
   DATA.prologue.map(e=>'<div class="ev" style="cursor:default">'+
     '<span class="code">'+e.code+'</span><span class="t">'+e.title+'</span>'+refsHtml(e.refs)+
     (e.study?'<a class="studylink" href="/bible-map/'+e.study+'" target="_blank">📖 사건별 성경공부 열기</a>':'')+
     '</div>').join('')+'</div>');
}
svg.addEventListener('wheel',ev=>{ev.preventDefault();const[x,y]=svgPt(ev);zoomAt(x,y,ev.deltaY<0?1.12:0.89);},{passive:false});
let down=false,sx,sy,otx,oty,moved;
/* 주의: pointerdown에서 setPointerCapture를 걸면 click이 svg로 재타겟팅되어
   점(장소) 클릭 핸들러가 전혀 실행되지 않는다. 실제로 끌기 시작한 뒤에만 캡처한다. */
let capId=null;
svg.addEventListener('pointerdown',ev=>{down=true;dragged=false;moved=0;sx=ev.clientX;sy=ev.clientY;otx=tx;oty=ty;});
svg.addEventListener('pointermove',ev=>{if(!down)return;const r=svg.getBoundingClientRect();
  const dx=(ev.clientX-sx)/r.width*1000, dy=(ev.clientY-sy)/r.height*680;
  moved+=Math.abs(ev.movementX)+Math.abs(ev.movementY);
  if(moved>5&&!dragged){dragged=true;svg.classList.add('grab');
    try{svg.setPointerCapture(ev.pointerId);capId=ev.pointerId;}catch(e){}}
  if(!dragged)return;
  tx=otx+dx;ty=oty+dy;apply();});
svg.addEventListener('pointerup',ev=>{down=false;svg.classList.remove('grab');
  if(capId!==null){try{svg.releasePointerCapture(capId);}catch(e){} capId=null;}
  setTimeout(()=>dragged=false,30);});
svg.addEventListener('pointercancel',()=>{down=false;dragged=false;svg.classList.remove('grab');});
</script></body></html>
